<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Owner Dashboard - GENZ FOOD SHOP</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f3;
      color: #171717;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .owner {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh {
      background: #ff5a1f;
      color: white;
      margin-bottom: 15px;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e9f8ef;
      color: #16803a;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-left: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #16803a;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }

      100% {
        opacity: 1;
      }

    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .summary-card p {
      margin: 0 0 8px;
      color: #777;
      font-size: 13px;
      font-weight: 700;
    }

    .summary-card h2 {
      margin: 0;
      font-size: 22px;
    }

    .sales {
      color: #16803a;
    }

    .upi {
      color: #6c3bbd;
    }

    .cash {
      color: #b56b00;
    }

    .profit {
      color: #00838f;
    }

    /* EXPENSE */

    .expense-box {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .expense-box h2 {
      margin-top: 0;
    }

    .expense-row {
      display: flex;
      gap: 10px;
    }

    .expense-row input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .expense-btn {
      background: #171717;
      color: white;
    }

    .expense-list {
      margin-top: 15px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    /* ORDERS */

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: 800;
      word-break: break-all;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .delivered {
      background: #d4edda;
      color: #155724;
    }

    .rejected {
      background: #f8d7da;
      color: #721c24;
    }

    .customer {
      background: #fff8f3;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .customer div {
      margin: 6px 0;
      font-size: 14px;
      word-break: break-word;
    }

    .items {
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      gap: 10px;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      margin-top: 15px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .controls select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-weight: 700;
    }

    .save-btn {
      background: #ff5a1f;
      color: white;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
    }

    .error {
      color: #c00;
    }

    .new-order {
      animation: newOrder .5s ease;
    }

    @keyframes newOrder {

      from {
        transform: scale(.98);
        opacity: .5;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }

    }

    @media (max-width: 800px) {

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .expense-row {
        flex-direction: column;
      }

      .controls {
        flex-direction: column;
      }

      .controls select,
      .save-btn {
        width: 100%;
      }

      .live {
        margin-left: 0;
        margin-top: 8px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>
        👑 Owner Dashboard
      </h1>

      <div class="owner">

        GENZ FOOD SHOP

        <br>

        Owner: snsuhail19@gmail.com

        <br>

        <span class="live">
          <span class="live-dot"></span>
          LIVE DATA
        </span>

      </div>

    </div>

  </div>


  <!-- REFRESH -->

  <button
    id="refreshBtn"
    class="refresh"
  >
    🔄 Refresh Dashboard
  </button>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="summary-card">

      <p>
        TOTAL SALES
      </p>

      <h2 class="sales">
        ₹<span id="totalSales">0</span>
      </h2>

    </div>


    <div class="summary-card">

      <p>
        UPI SALES
      </p>

      <h2 class="upi">
        ₹<span id="upiSales">0</span>
      </h2>

    </div>


    <div class="summary-card">

      <p>
        CASH SALES
      </p>

      <h2 class="cash">
        ₹<span id="cashSales">0</span>
      </h2>

    </div>


    <div class="summary-card">

      <p>
        NET PROFIT
      </p>

      <h2 class="profit">
        ₹<span id="netProfit">0</span>
      </h2>

    </div>

  </div>


  <!-- EXPENSES -->

  <div class="expense-box">

    <h2>
      💸 Business Expenses
    </h2>

    <p>
      Add expenses such as ingredients, delivery,
      electricity, packaging, etc.
    </p>


    <div class="expense-row">

      <input
        id="expenseName"
        type="text"
        placeholder="Expense name"
      >


      <input
        id="expenseAmount"
        type="number"
        min="0"
        placeholder="Amount ₹"
      >


      <button
        id="addExpenseBtn"
        class="expense-btn"
      >
        + Add Expense
      </button>

    </div>


    <div
      id="expenseList"
      class="expense-list"
    ></div>


    <strong>

      Total Expenses:
      ₹<span id="totalExpenses">0</span>

    </strong>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    Checking owner access...
  </div>


  <!-- ORDERS -->

  <div
    id="orders"
    class="orders"
  ></div>

</div>


<script type="module">

  import {
    initializeApp
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    query,
    orderBy,
    doc,
    updateDoc,
    addDoc,
    serverTimestamp,
    onSnapshot
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =====================================
     FIREBASE CONFIG
  ===================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

    authDomain:
      "genz-food-shop.firebaseapp.com",

    projectId:
      "genz-food-shop",

    storageBucket:
      "genz-food-shop.firebasestorage.app",

    messagingSenderId:
      "259228392374",

    appId:
      "1:259228392374:web:6af3a0d3c93597a5b5bf17",

    measurementId:
      "G-LT095LEWJ6"

  };


  /* =====================================
     INITIALIZE
  ===================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =====================================
     OWNER
  ===================================== */

  const OWNER_EMAIL =
    "snsuhail19@gmail.com";


  const loading =
    document.getElementById("loading");

  const ordersContainer =
    document.getElementById("orders");


  let totalSales = 0;
  let upiSales = 0;
  let cashSales = 0;

  let expenses = [];

  let stopOrdersListener = null;
  let stopExpensesListener = null;


  /* =====================================
     ESCAPE HTML
  ===================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================
     EXPENSES - REAL TIME
  ===================================== */

  function startExpensesListener() {

    if (stopExpensesListener) {

      stopExpensesListener();

    }


    const expenseRef =
      collection(
        db,
        "expenses"
      );


    stopExpensesListener =
      onSnapshot(
        expenseRef,

        (snapshot) => {

          expenses = [];


          snapshot.forEach(
            (docSnapshot) => {

              const data =
                docSnapshot.data();


              expenses.push({

                id:
                  docSnapshot.id,

                name:
                  data.name ||
                  "Expense",

                amount:
                  Number(
                    data.amount || 0
                  )

              });

            }
          );


          renderExpenses();

        },

        (error) => {

          console.error(
            "Expense listener error:",
            error
          );

        }

      );

  }


  /* =====================================
     RENDER EXPENSES
  ===================================== */

  function renderExpenses() {

    const list =
      document.getElementById(
        "expenseList"
      );


    if (expenses.length === 0) {

      list.innerHTML =
        "<p>No expenses added yet.</p>";

    }

    else {

      list.innerHTML =
        expenses.map(
          expense => `

            <div class="expense-item">

              <span>
                ${escapeHTML(
                  expense.name
                )}
              </span>

              <strong>
                ₹${expense.amount.toFixed(2)}
              </strong>

            </div>

          `
        ).join("");

    }


    const totalExpenses =
      expenses.reduce(
        (sum, expense) =>
          sum + expense.amount,
        0
      );


    document.getElementById(
      "totalExpenses"
    ).textContent =
      totalExpenses.toFixed(2);


    updateProfit();

  }


  /* =====================================
     PROFIT
  ===================================== */

  function updateProfit() {

    const totalExpenses =
      expenses.reduce(
        (sum, expense) =>
          sum + expense.amount,
        0
      );


    const profit =
      totalSales -
      totalExpenses;


    document.getElementById(
      "netProfit"
    ).textContent =
      profit.toFixed(2);

  }


  /* =====================================
     ADD EXPENSE
  ===================================== */

  document
    .getElementById("addExpenseBtn")
    .addEventListener(
      "click",
      async () => {

        const name =
          document
            .getElementById("expenseName")
            .value
            .trim();


        const amount =
          Number(
            document
              .getElementById("expenseAmount")
              .value
          );


        if (!name || amount <= 0) {

          alert(
            "Enter expense name and valid amount."
          );

          return;

        }


        const button =
          document.getElementById(
            "addExpenseBtn"
          );


        button.disabled = true;

        button.textContent =
          "Adding...";


        try {

          await addDoc(
            collection(
              db,
              "expenses"
            ),
            {

              name:
                name,

              amount:
                amount,

              createdAt:
                serverTimestamp()

            }
          );


          document.getElementById(
            "expenseName"
          ).value = "";


          document.getElementById(
            "expenseAmount"
          ).value = "";

        }

        catch (error) {

          console.error(error);

          alert(
            "Could not add expense: " +
            (
              error.code ||
              error.message
            )
          );

        }

        finally {

          button.disabled = false;

          button.textContent =
            "+ Add Expense";

        }

      }
    );


  /* =====================================
     LOAD ORDERS - REAL TIME
  ===================================== */

  function startOrdersListener() {

    if (stopOrdersListener) {

      stopOrdersListener();

    }


    loading.style.display =
      "block";

    loading.textContent =
      "Loading live orders...";


    ordersContainer.innerHTML =
      "";


    const ordersRef =
      collection(
        db,
        "orders"
      );


    const ordersQuery =
      query(
        ordersRef,
        orderBy(
          "createdAt",
          "desc"
        )
      );


    stopOrdersListener =
      onSnapshot(

        ordersQuery,

        (snapshot) => {

          totalSales = 0;
          upiSales = 0;
          cashSales = 0;


          ordersContainer.innerHTML =
            "";


          if (snapshot.empty) {

            loading.style.display =
              "none";


            ordersContainer.innerHTML =
              '<div class="empty">' +
              "No orders yet." +
              "</div>";


            updateSummary();

            return;

          }


          loading.style.display =
            "none";


          snapshot.forEach(
            (docSnapshot) => {

              const order =
                docSnapshot.data();


              displayOrder(
                docSnapshot.id,
                order
              );


              /*
                Only Delivered orders
                count as sales.
              */

              const status =
                order.status ||
                "Pending";


              if (
                status ===
                "Delivered"
              ) {

                const total =
                  Number(
                    order.total || 0
                  );


                totalSales +=
                  total;


                const paymentMode =
                  (
                    order.paymentMode ||
                    ""
                  ).toLowerCase();


                if (
                  paymentMode ===
                  "upi"
                ) {

                  upiSales +=
                    total;

                }


                if (
                  paymentMode ===
                  "cash"
                ) {

                  cashSales +=
                    total;

                }

              }

            }
          );


          updateSummary();

        },

        (error) => {

          console.error(
            "Orders listener error:",
            error
          );


          loading.style.display =
            "none";


          ordersContainer.innerHTML =
            '<div class="error">' +
            "Could not load orders.<br><br>" +
            escapeHTML(
              error.code ||
              error.message
            ) +
            "</div>";

        }

      );

  }


  /* =====================================
     SUMMARY
  ===================================== */

  function updateSummary() {

    document.getElementById(
      "totalSales"
    ).textContent =
      totalSales.toFixed(2);


    document.getElementById(
      "upiSales"
    ).textContent =
      upiSales.toFixed(2);


    document.getElementById(
      "cashSales"
    ).textContent =
      cashSales.toFixed(2);


    updateProfit();

  }


  /* =====================================
     DISPLAY ORDER
  ===================================== */

  function displayOrder(
    orderId,
    order
  ) {

    const orderElement =
      document.createElement(
        "div"
      );


    orderElement.className =
      "order";


    let itemsHTML = "";


    if (
      Array.isArray(
        order.items
      )
    ) {

      order.items.forEach(
        (item) => {

          const name =
            item.name ||
            "Food item";


          const quantity =
            Number(
              item.quantity || 1
            );


          const price =
            Number(
              item.price || 0
            );


          itemsHTML += `

            <div class="item">

              <span>

                ${escapeHTML(name)}

                ×

                ${quantity}

              </span>

              <strong>

                ₹${(
                  price * quantity
                ).toFixed(2)}

              </strong>

            </div>

          `;

        }
      );

    }


    const customerName =
      order.customerName ||
      order.name ||
      "Not available";


    const email =
      order.customerEmail ||
      order.email ||
      "Not available";


    const phone =
      order.phone ||
      order.mobile ||
      "Not available";


    const address =
      order.address ||
      "Not available";


    const total =
      Number(
        order.total || 0
      );


    const status =
      order.status ||
      "Pending";


    const paymentMode =
      order.paymentMode ||
      "";


    let statusClass =
      "pending";


    if (
      status ===
      "Delivered"
    ) {

      statusClass =
        "delivered";

    }


    if (
      status ===
      "Rejected"
    ) {

      statusClass =
        "rejected";

    }


    orderElement.innerHTML = `

      <div class="order-header">

        <div class="order-id">

          Order #${escapeHTML(
            orderId
          )}

        </div>

        <div
          class="status ${statusClass}"
        >

          ${escapeHTML(
            status
          )}

        </div>

      </div>


      <div class="customer">

        <div>

          <strong>Name:</strong>

          ${escapeHTML(
            customerName
          )}

        </div>


        <div>

          <strong>Email:</strong>

          ${escapeHTML(
            email
          )}

        </div>


        <div>

          <strong>Phone:</strong>

          ${escapeHTML(
            phone
          )}

        </div>


        <div>

          <strong>Address:</strong>

          ${escapeHTML(
            address
          )}

        </div>

      </div>


      <div class="items">

        ${itemsHTML}

      </div>


      <div class="total">

        Total:
        ₹${total.toFixed(2)}

      </div>


      <div class="controls">

        <select
          id="status-${escapeHTML(
            orderId
          )}"
        >

          <option
            value="Pending"
            ${status === "Pending"
              ? "selected"
              : ""}
          >
            Pending
          </option>


          <option
            value="Delivered"
            ${status === "Delivered"
              ? "selected"
              : ""}
          >
            Delivered
          </option>


          <option
            value="Rejected"
            ${status === "Rejected"
              ? "selected"
              : ""}
          >
            Rejected
          </option>

        </select>


        <select
          id="payment-${escapeHTML(
            orderId
          )}"
        >

          <option
            value=""
            ${!paymentMode
              ? "selected"
              : ""}
          >
            Payment Mode
          </option>


          <option
            value="UPI"
            ${paymentMode === "UPI"
              ? "selected"
              : ""}
          >
            💳 UPI
          </option>


          <option
            value="Cash"
            ${paymentMode === "Cash"
              ? "selected"
              : ""}
          >
            💵 Cash on Delivery
          </option>

        </select>


        <button
          class="save-btn"
          data-order-id="${escapeHTML(
            orderId
          )}"
        >

          💾 Save

        </button>

      </div>

    `;


    const saveButton =
      orderElement.querySelector(
        ".save-btn"
      );


    saveButton.addEventListener(
      "click",
      () => {

        saveOrder(
          orderId,
          saveButton
        );

      }
    );


    ordersContainer.appendChild(
      orderElement
    );

  }


  /* =====================================
     SAVE ORDER
  ===================================== */

  async function saveOrder(
    orderId,
    button
  ) {

    const statusElement =
      document.getElementById(
        "status-" +
        orderId
      );


    const paymentElement =
      document.getElementById(
        "payment-" +
        orderId
      );


    if (
      !statusElement ||
      !paymentElement
    ) {

      return;

    }


    const status =
      statusElement.value;


    const paymentMode =
      paymentElement.value;


    if (!paymentMode) {

      alert(
        "Please select UPI or Cash on Delivery."
      );

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Saving...";


    try {

      await updateDoc(
        doc(
          db,
          "orders",
          orderId
        ),
        {

          status:
            status,

          paymentMode:
            paymentMode

        }
      );


      /*
        No manual reload needed.
        onSnapshot() automatically
        updates the dashboard.
      */

    }

    catch (error) {

      console.error(
        "UPDATE ERROR:",
        error
      );


      alert(
        "Could not update order: " +
        (
          error.code ||
          error.message
        )
      );

    }

    finally {

      button.disabled =
        false;

      button.textContent =
        "💾 Save";

    }

  }


  /* =====================================
     AUTHENTICATION
  ===================================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      const email =
        (
          user.email ||
          ""
        ).toLowerCase();


      if (
        email !==
        OWNER_EMAIL.toLowerCase()
      ) {

        loading.innerHTML =
          "❌ Access denied.<br><br>" +
          "This page is only available to the shop owner.";

        return;

      }


      /*
        START REAL-TIME LISTENERS
      */

      startExpensesListener();

      startOrdersListener();

    }
  );


  /* =====================================
     MANUAL REFRESH
     Still available if needed.
  ===================================== */

  document
