  <title>Owner Dashboard - GENZ FOOD SHOP</title>  <style>

    * {

    .refresh {
      background: #ff5a1f;

    /* =========================
       BUSINESS SUMMARY

    .summary {

      gap: 12px;

    .summary-card {

    /* =========================

    .orders {

    .order {
      background: white;

    .order-header {

    .order-id {

    .status {

    .pending {

    .delivered {

    .rejected {

    .customer {

    .items {

    .item {
      display: flex;

      padding: 8px 0;

    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      margin-top: 15px;
    }

    /* =========================
       CONTROLS
    ========================== */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .controls select {
      padding: 10px;

      border-radius: 10px;
      background: white;

    .save-btn {

    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 30px;
      border-radius: 18px;

    }

    .error {

    }

    @media (max-width: 800px) {

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      body {
        padding: 10px;

      .header {
        align-items: flex-start;
        flex-direction: column;

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .expense-row {
        flex-direction: column;
      }

      .controls {
        flex-direction: column;
      }

      .controls select,
      .save-btn {

      }

    }

  </style></head><body><div class="container">  <!-- =========================

  </button>  <!-- =========================

  <p>

  </p>

  <h2 class="sales">
    ₹<span id="totalSales">0</span>

</div>


<div class="summary-card">

  <p>
    UPI SALES
  </p>

  <h2 class="upi">
    ₹<span id="upiSales">0</span>
  </h2>

</div>


<div class="summary-card">

  <p>
    CASH SALES
  </p>

  <h2 class="cash">
    ₹<span id="cashSales">0</span>
  </h2>

  <p>

  </p>

  <h2 class="profit">
    ₹<span id="netProfit">0</span>

  </div>  <!-- =========================

    id="orders"
    class="orders"
  ></div></div><script type="module">


  import {
    initializeApp
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc,
    addDoc,
    serverTimestamp
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* ==============================
     FIREBASE CONFIG
  ============================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

    authDomain:
      "genz-food-shop.firebaseapp.com",

    projectId:
      "genz-food-shop",

    storageBucket:
      "genz-food-shop.firebasestorage.app",

    messagingSenderId:
      "259228392374",

    appId:
      "1:259228392374:web:6af3a0d3c93597a5b5bf17",

    measurementId:
      "G-LT095LEWJ6"

  };


  /* ==============================
     INITIALIZE
  ============================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* ==============================
     OWNER
  ============================== */

  const OWNER_EMAIL =
    "snsuhail19@gmail.com";


  const loading =
    document.getElementById("loading");

  const ordersContainer =
    document.getElementById("orders");


  let totalSales = 0;
  let upiSales = 0;
  let cashSales = 0;


  /* ==============================
     EXPENSES
  ============================== */

  let expenses = [];


  async function loadExpenses() {

    expenses = [];

    try {

      const expenseRef =
        collection(
          db,
          "expenses"
        );

      const snapshot =
        await getDocs(
          expenseRef
        );

      snapshot.forEach(
        (docSnapshot) => {

          const data =
            docSnapshot.data();

          expenses.push({
            id: docSnapshot.id,
            name: data.name || "Expense",
            amount: Number(data.amount || 0)
          });

        }
      );

      renderExpenses();

    }

    catch (error) {

      console.error(
        "Expense error:",
        error
      );

    }

  }


  function renderExpenses() {

    const list =
      document.getElementById(
        "expenseList"
      );


    if (expenses.length === 0) {

      list.innerHTML =
        "<p>No expenses added yet.</p>";

    }

    else {

      list.innerHTML =
        expenses.map(
          expense => `

            <div class="expense-item">

              <span>
                ${escapeHTML(expense.name)}
              </span>

              <strong>
                ₹${expense.amount.toFixed(2)}
              </strong>

            </div>

          `
        ).join("");

    }


    const totalExpenses =
      expenses.reduce(
        (sum, expense) =>
          sum + expense.amount,
        0
      );


    document.getElementById(
      "totalExpenses"
    ).textContent =
      totalExpenses.toFixed(2);


    updateProfit();

  }


  function updateProfit() {

    const totalExpenses =
      expenses.reduce(
        (sum, expense) =>
          sum + expense.amount,
        0
      );


    const profit =
      totalSales -
      totalExpenses;


    document.getElementById(
      "netProfit"
    ).textContent =
      profit.toFixed(2);

  }


  document
    .getElementById("addExpenseBtn")
    .addEventListener(
      "click",
      async () => {

        const name =
          document
            .getElementById("expenseName")
            .value.trim();


        const amount =
          Number(
            document
              .getElementById("expenseAmount")
              .value
          );


        if (!name || amount <= 0) {

          alert(
            "Enter expense name and valid amount."
          );

          return;

        }


        try {

          await addDoc(
            collection(
              db,
              "expenses"
            ),
            {
              name: name,
              amount: amount,
              createdAt:
                serverTimestamp()
            }
          );


          document.getElementById(
            "expenseName"
          ).value = "";


          document.getElementById(
            "expenseAmount"
          ).value = "";


          await loadExpenses();

        }

        catch (error) {

          alert(
            "Could not add expense: " +
            (
              error.code ||
              error.message
            )
          );

        }

      }
    );


  /* ==============================
     LOAD ORDERS
  ============================== */

  async function loadOrders() {

    loading.style.display =
      "block";

    loading.textContent =
      "Loading orders...";

    ordersContainer.innerHTML =
      "";


    totalSales = 0;
    upiSales = 0;
    cashSales = 0;


    try {

      const ordersRef =
        collection(
          db,
          "orders"
        );


      const ordersQuery =
        query(
          ordersRef,
          orderBy(
            "createdAt",
            "desc"
          )
        );


      const snapshot =
        await getDocs(
          ordersQuery
        );


      if (snapshot.empty) {

        loading.style.display =
          "none";


        ordersContainer.innerHTML =
          '<div class="empty">No orders yet.</div>';


        updateSummary();

        return;

      }


      loading.style.display =
        "none";


      snapshot.forEach(
        (docSnapshot) => {

          const order =
            docSnapshot.data();


          displayOrder(
            docSnapshot.id,
            order
          );


          /*
             Count only Delivered
             orders as sales/profit.
          */

          const status =
            order.status ||
            "Pending";


          if (
            status === "Delivered"
          ) {

            const total =
              Number(
                order.total || 0
              );


            totalSales += total;


            const paymentMode =
              (
                order.paymentMode ||
                ""
              ).toLowerCase();


            if (
              paymentMode === "upi"
            ) {

              upiSales += total;

            }


            if (
              paymentMode ===
              "cash"
            ) {

              cashSales += total;

            }

          }

        }
      );


      updateSummary();

    }

    catch (error) {

      console.error(error);

      loading.style.display =
        "none";


      ordersContainer.innerHTML =
        '<div class="error">' +
        "Could not load orders.<br><br>" +
        (
          error.code ||
          error.message
        ) +
        "</div>";

    }

  }


  /* ==============================
     SUMMARY
  ============================== */

  function updateSummary() {

    document.getElementById(
      "totalSales"
    ).textContent =
      totalSales.toFixed(2);


    document.getElementById(
      "upiSales"
    ).textContent =
      upiSales.toFixed(2);


    document.getElementById(
      "cashSales"
    ).textContent =
      cashSales.toFixed(2);


    updateProfit();

  }


  /* ==============================
     DISPLAY ORDER
  ============================== */

  function displayOrder(
    orderId,
    order
  ) {

    const orderElement =
      document.createElement(
        "div"
      );


    orderElement.className =
      "order";


    let itemsHTML = "";


    if (
      Array.isArray(order.items)
    ) {

      order.items.forEach(
        (item) => {

          const name =
            item.name ||
            "Food item";


          const quantity =
            item.quantity ||
            1;


          const price =
            Number(
              item.price || 0
            );


          itemsHTML +=

            '<div class="item">' +

            '<span>' +

            escapeHTML(name) +

            " × " +

            quantity +

            "</span>" +

            '<strong>₹' +

            (
              price * quantity
            ).toFixed(2) +

            "</strong>" +

            "</div>";

        }
      );

    }


    const customerName =
      order.customerName ||
      order.name ||
      "Not available";


    const email =
      order.customerEmail ||
      order.email ||
      "Not available";


    const phone =
      order.phone ||
      order.mobile ||
      "Not available";


    const address =
      order.address ||
      "Not available";


    const total =
      Number(
        order.total || 0
      );


    const status =
      order.status ||
      "Pending";


    const paymentMode =
      order.paymentMode ||
      "Not Selected";


    let statusClass =
      "pending";


    if (
      status === "Delivered"
    ) {

      statusClass =
        "delivered";

    }


    if (
      status === "Rejected"
    ) {

      statusClass =
        "rejected";

    }


    orderElement.innerHTML = `

      <div class="order-header">

        <div class="order-id">

          Order #${escapeHTML(orderId)}

        </div>

        <div class="status ${statusClass}">

          ${escapeHTML(status)}

        </div>

      </div>


      <div class="customer">

        <div>
          <strong>Name:</strong>
          ${escapeHTML(customerName)}
        </div>

        <div>
          <strong>Email:</strong>
          ${escapeHTML(email)}
        </div>

        <div>
          <strong>Phone:</strong>
          ${escapeHTML(phone)}
        </div>

        <div>
          <strong>Address:</strong>
          ${escapeHTML(address)}
        </div>

      </div>


      <div class="items">

        ${itemsHTML}

      </div>


      <div class="total">

        Total: ₹${total.toFixed(2)}

      </div>


      <div class="controls">

        <select
          id="status-${orderId}"
        >

          <option
            value="Pending"
            ${status === "Pending" ? "selected" : ""}
          >
            Pending
          </option>

          <option
            value="Delivered"
            ${status === "Delivered" ? "selected" : ""}
          >
            Delivered
          </option>

          <option
            value="Rejected"
            ${status === "Rejected" ? "selected" : ""}
          >
            Rejected
          </option>

        </select>


        <select
          id="payment-${orderId}"
        >

          <option
            value=""
            ${!order.paymentMode ? "selected" : ""}
          >
            Payment Mode
          </option>

          <option
            value="UPI"
            ${paymentMode === "UPI" ? "selected" : ""}
          >
            💳 UPI
          </option>

          <option
            value="Cash"
            ${paymentMode === "Cash" ? "selected" : ""}
          >
            💵 Cash on Delivery
          </option>

        </select>


        <button
          class="save-btn"
          onclick="saveOrder(
            '${orderId}'
          )"
        >
          💾 Save
        </button>

      </div>

    `;


    ordersContainer.appendChild(
      orderElement
    );

  }


  /* ==============================
     SAVE ORDER
  ============================== */

  window.saveOrder =
    async function(orderId) {

      const status =
        document.getElementById(
          "status-" + orderId
        ).value;


      const paymentMode =
        document.getElementById(
          "payment-" + orderId
        ).value;


      if (!paymentMode) {

        alert(
          "Please select UPI or Cash on Delivery."
        );

        return;

      }


      try {

        await updateDoc(
          doc(
            db,
            "orders",
            orderId
          ),
          {

            status:
              status,

            paymentMode:
              paymentMode

          }
        );


        alert(
          "Order updated successfully."
        );


        await loadOrders();

      }

      catch (error) {

        console.error(error);

        alert(
          "Could not update order: " +
          (
            error.code ||
            error.message
          )
        );

      }

    };


  /* ==============================
     SECURITY / HTML ESCAPE
  ============================== */

  function escapeHTML(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ==============================
     AUTHENTICATION
  ============================== */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      const email =
        (
          user.email || ""
        ).toLowerCase();


      if (
        email !==
        OWNER_EMAIL.toLowerCase()
      ) {

        loading.innerHTML =
          "❌ Access denied.<br><br>" +
          "This page is only available to the shop owner.";

        return;

      }


      await loadExpenses();

      await loadOrders();

    }
  );


  /* ==============================
     REFRESH
  ============================== */

  document
    .getElementById("refreshBtn")
    .addEventListener(
      "click",
      async () => {

        await loadExpenses();

        await loadOrders();

      }
    );


</script></body>
</html>
