<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Owner Dashboard - GENZ FOOD SHOP</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f3;
      color: #171717;
      padding: 15px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    /* HEADER */

    .header {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .owner {
      color: #777;
      font-size: 13px;
      margin-top: 6px;
    }

    .refresh {
      background: #ff5a1f;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow:
        0 8px 25px rgba(0,0,0,.06);
    }

    .stat p {
      margin: 0 0 8px;
      color: #777;
      font-size: 13px;
    }

    .stat strong {
      font-size: 25px;
    }

    /* ORDERS */

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 8px 25px rgba(0,0,0,.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: 900;
    }

    .type {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #171717;
      color: white;
      font-size: 11px;
      font-weight: 800;
      margin-left: 5px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff0e9;
      color: #ff5a1f;
      font-size: 12px;
      font-weight: 800;
    }

    .customer {
      background: #fff8f3;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .customer div {
      margin: 7px 0;
      font-size: 14px;
    }

    .items {
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      margin-top: 15px;
    }

    /* PAYMENT */

    .payment-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .payment {
      padding: 7px 11px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 12px;
      font-weight: 800;
    }

    .paid {
      background: #dff7e6;
      color: #167534;
    }

    .pending {
      background: #fff2d8;
      color: #8a5a00;
    }

    /* CONTROLS */

    .controls {
      border-top: 1px solid #eee;
      margin-top: 15px;
      padding-top: 15px;
    }

    .controls-title {
      font-weight: 800;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .status-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .status-buttons button {
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #eee;
    }

    .status-buttons button:hover {
      background: #ff5a1f;
      color: white;
    }

    .payment-buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .payment-buttons button {
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .paid-btn {
      background: #dff7e6;
      color: #167534;
    }

    .pending-btn {
      background: #fff2d8;
      color: #8a5a00;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
    }

    .error {
      color: #c00;
    }

    /* MOBILE */

    @media(max-width:800px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media(max-width:600px) {

      body {
        padding: 10px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .refresh {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat strong {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>
        👑 Owner Dashboard
      </h1>

      <div class="owner">

        GENZ FOOD SHOP

        <br>

        Owner:
        snsuhail19@gmail.com

      </div>

    </div>


    <button
      id="refreshBtn"
      class="refresh"
    >
      🔄 Refresh
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <p>
        Total Orders
      </p>

      <strong id="totalOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <p>
        Delivered
      </p>

      <strong id="deliveredOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <p>
        Pending
      </p>

      <strong id="pendingOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <p>
        Total Sales
      </p>

      <strong>
        ₹<span id="totalSales">0</span>
      </strong>

    </div>

  </div>


  <!-- ORDERS -->

  <div
    id="loading"
    class="loading"
  >
    Checking owner access...
  </div>


  <div
    id="orders"
    class="orders"
  ></div>


</div>


<script type="module">


import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

  authDomain:
    "genz-food-shop.firebaseapp.com",

  projectId:
    "genz-food-shop",

  storageBucket:
    "genz-food-shop.firebasestorage.app",

  messagingSenderId:
    "259228392374",

  appId:
    "1:259228392374:web:6af3a0d3c93597a5b5bf17",

  measurementId:
    "G-LT095LEWJ6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* OWNER */

const OWNER_EMAIL =
  "snsuhail19@gmail.com";


/* ELEMENTS */

const loading =
  document.getElementById(
    "loading"
  );

const ordersContainer =
  document.getElementById(
    "orders"
  );


/* LOAD ORDERS */

async function loadOrders() {

  loading.style.display =
    "block";

  loading.textContent =
    "Loading orders...";

  ordersContainer.innerHTML =
    "";


  try {

    const ordersRef =
      collection(
        db,
        "orders"
      );


    const ordersQuery =
      query(
        ordersRef,
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(
        ordersQuery
      );


    loading.style.display =
      "none";


    if (snapshot.empty) {

      ordersContainer.innerHTML =
        '<div class="empty">No orders yet.</div>';

      updateStats([]);

      return;

    }


    const allOrders = [];


    snapshot.forEach(
      orderSnapshot => {

        const order =
          orderSnapshot.data();


        order._id =
          orderSnapshot.id;


        allOrders.push(order);


        displayOrder(
          orderSnapshot.id,
          order
        );

      }
    );


    updateStats(
      allOrders
    );

  }

  catch(error) {

    console.error(error);

    loading.style.display =
      "none";

    ordersContainer.innerHTML =

      '<div class="error">' +

      "Could not load orders.<br><br>" +

      (
        error.code ||
        error.message
      ) +

      "</div>";

  }

}


/* STATS */

function updateStats(orders) {

  let totalSales = 0;

  let delivered = 0;

  let pending = 0;


  orders.forEach(order => {

    const status =
      order.status ||
      "Pending";


    if (status === "Delivered") {

      delivered++;

      totalSales +=
        Number(
          order.total || 0
        );

    }


    if (
      status === "Pending" ||
      status === "Accepted" ||
      status === "Preparing" ||
      status === "Out for Delivery"
    ) {

      pending++;

    }

  });


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    delivered;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending;


  document.getElementById(
    "totalSales"
  ).textContent =
    totalSales.toFixed(2);

}


/* DISPLAY ORDER */

function displayOrder(
  orderId,
  order
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "order";


  let itemsHTML =
    "";


  if (
    Array.isArray(
      order.items
    )
  ) {

    order.items.forEach(
      item => {

        const name =
          item.name ||
          "Food item";


        const quantity =
          item.quantity ||
          1;


        const price =
          Number(
            item.price || 0
          );


        itemsHTML +=

          '<div class="item">' +

          '<span>' +

          name +

          " × " +

          quantity +

          "</span>" +

          '<strong>₹' +

          (
            price *
            quantity
          ).toFixed(2) +

          "</strong>" +

          "</div>";

      }
    );

  }


  const customerName =
    order.customerName ||
    order.name ||
    "Not available";


  const email =
    order.customerEmail ||
    order.email ||
    "Not available";


  const phone =
    order.phone ||
    order.mobile ||
    "Not available";


  const address =
    order.address ||
    "Not available";


  const total =
    Number(
      order.total || 0
    );


  const status =
    order.status ||
    "Pending";


  const paymentMethod =
    order.paymentMethod ||
    "Not selected";


  const paymentStatus =
    order.paymentStatus ||
    "Pending";


  const customerType =
    order.customerType ||
    "Customer";


  element.innerHTML = `

    <div class="order-header">

      <div>

        <div class="order-id">

          Order #${orderId}

          <span class="type">
            ${customerType}
          </span>

        </div>

      </div>


      <div class="status">
        ${status}
      </div>

    </div>


    <div class="customer">

      <div>
        <strong>Name:</strong>
        ${customerName}
      </div>

      <div>
        <strong>Email:</strong>
        ${email}
      </div>

      <div>
        <strong>Phone:</strong>
        ${phone}
      </div>

      <div>
        <strong>Address:</strong>
        ${address}
      </div>

    </div>


    <div class="items">

      ${itemsHTML}

    </div>


    <div class="payment-box">

      <span class="payment">
        💳 ${paymentMethod}
      </span>

      <span class="payment ${
        paymentStatus === "Paid"
          ? "paid"
          : "pending"
      }">

        💰 Payment:
        ${paymentStatus}

      </span>

    </div>


    <div class="total">

      Total:
      ₹${total.toFixed(2)}

    </div>


    <div class="controls">

      <div class="controls-title">
        📦 Order Status
      </div>


      <div class="status-buttons">

        <button
          onclick="changeStatus('${orderId}', 'Pending')"
        >
          Pending
        </button>

        <button
          onclick="changeStatus('${orderId}', 'Accepted')"
        >
          Accepted
        </button>

        <button
          onclick="changeStatus('${orderId}', 'Preparing')"
        >
          Preparing
        </button>

        <button
          onclick="changeStatus('${orderId}', 'Out for Delivery')"
        >
          Out for Delivery
        </button>

        <button
          onclick="changeStatus('${orderId}', 'Delivered')"
        >
          Delivered
        </button>

        <button
          onclick="changeStatus('${orderId}', 'Rejected')"
        >
          Rejected
        </button>

      </div>


      <div class="controls-title"
           style="margin-top:15px;">

        💳 Payment Status

      </div>


      <div class="payment-buttons">

        <button
          class="paid-btn"
          onclick="changePaymentStatus('${orderId}', 'Paid')"
        >
          ✅ Paid
        </button>

        <button
          class="pending-btn"
          onclick="changePaymentStatus('${orderId}', 'Pending')"
        >
          ⏳ Pending
        </button>

      </div>

    </div>

  `;


  ordersContainer.appendChild(
    element
  );

}


/* CHANGE ORDER STATUS */

window.changeStatus =
async function(
  orderId,
  newStatus
) {

  try {

    await updateDoc(

      doc(
        db,
        "orders",
        orderId
      ),

      {
        status:
          newStatus
      }

    );


    loadOrders();

  }

  catch(error) {

    console.error(error);

    alert(
      "Could not update order: " +
      (
        error.code ||
        error.message
      )
    );

  }

};


/* CHANGE PAYMENT STATUS */

window.changePaymentStatus =
async function(
  orderId,
  newStatus
) {

  try {

    await updateDoc(

      doc(
        db,
        "orders",
        orderId
      ),

      {
        paymentStatus:
          newStatus
      }

    );


    loadOrders();

  }

  catch(error) {

    console.error(error);

    alert(
      "Could not update payment: " +
      (
        error.code ||
        error.message
      )
    );

  }

};


/* AUTH */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    const email =
      (
        user.email || ""
      ).toLowerCase();


    if (
      email !==
      OWNER_EMAIL.toLowerCase()
    ) {

      loading.innerHTML =
        "❌ Access denied.<br><br>" +
        "This page is only available to the shop owner.";

      return;

    }


    await loadOrders();

  }
);


/* REFRESH */

document
  .getElementById(
    "refreshBtn"
  )
  .addEventListener(
    "click",
    loadOrders
  );


</script>

</body>
</html>
