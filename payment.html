<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout - GENZ FOOD SHOP</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    body {
      min-height: 100vh;
      background: #f7f7f7;
    }

    .checkout {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #ff5a1f;
      text-decoration: none;
      font-weight: 800;
    }

    .box {
      background: white;
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .box h2 {
      margin: 0 0 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
    }

    .field textarea {
      min-height: 85px;
      resize: vertical;
    }

    .location-box {
      background: #eef9f1;
      color: #176b35;
      padding: 13px;
      border-radius: 11px;
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .item img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 12px;
    }

    .info {
      flex: 1;
    }

    .info h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .info p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: #eee;
      font-size: 20px;
      cursor: pointer;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .total {
      font-size: 22px;
      font-weight: 900;
      border-top: 2px solid #eee;
      padding-top: 15px;
    }

    .payment-title {
      margin-top: 25px;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .payment-option {
      border: 2px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
    }

    .payment-option:hover {
      border-color: #ff5a1f;
    }

    .payment-option input {
      margin-right: 8px;
    }

    .payment-option strong {
      font-size: 16px;
    }

    .payment-option p {
      margin: 6px 0 0 25px;
      color: #777;
      font-size: 13px;
    }

    .pay {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #ff5a1f;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
    }

    .pay:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .success {
      display: none;
      text-align: center;
    }

    .success h2 {
      color: #16803a;
    }

    .order-id {
      background: #fff3ec;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      font-weight: 800;
      word-break: break-all;
    }

    .order-text {
      background: #f6f6f6;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .message {
      display: none;
      background: #fff3ec;
      color: #8b3c17;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media(max-width:600px) {

      .item {
        align-items: flex-start;
      }

      .item img {
        width: 58px;
        height: 58px;
      }

      .qty {
        flex-wrap: wrap;
      }

      .payment-options {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div class="brand">

    <div class="logo">
      G
    </div>

    <div>

      <h1>
        GENZ FOOD SHOP
      </h1>

      <p>
        Checkout
      </p>

    </div>

  </div>

</header>


<main class="checkout">

  <a
    class="back"
    href="index.html"
  >
    ← Back to Menu
  </a>


  <div
    id="message"
    class="message"
  ></div>


  <div
    id="loading"
    class="box loading"
  >
    Checking your account...
  </div>


  <!-- ORDER -->

  <div
    class="box"
    id="orderBox"
    style="display:none;"
  >

    <h2>
      🛒 Your Order
    </h2>

    <div id="items"></div>


    <div class="summary-row">

      <span>
        Subtotal
      </span>

      <strong>
        ₹<span id="subtotal">0</span>
      </strong>

    </div>


    <div class="summary-row">

      <span>
        Delivery
      </span>

      <strong>
        ₹<span id="delivery">0</span>
      </strong>

    </div>


    <div class="summary-row total">

      <span>
        Total
      </span>

      <strong>
        ₹<span id="total">0</span>
      </strong>

    </div>

  </div>


  <!-- CUSTOMER -->

  <div
    class="box"
    id="customerBox"
    style="display:none;"
  >

    <h2>
      👤 Customer Details
    </h2>


    <div class="field">

      <label>
        Name
      </label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
      >

    </div>


    <div class="field">

      <label>
        Phone
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="9876543210"
      >

    </div>


    <div class="field">

      <label>
        Delivery Address
      </label>

      <textarea
        id="address"
        placeholder="Enter your full delivery address"
      ></textarea>

    </div>


    <!-- LOCATION -->

    <div
      id="locationBox"
      class="location-box"
    >
      📍 Checking saved delivery location...
    </div>


    <!-- PAYMENT -->

    <h2 class="payment-title">
      💳 Payment Method
    </h2>


    <div class="payment-options">

      <label class="payment-option">

        <input
          type="radio"
          name="paymentMethod"
          value="UPI"
        >

        <strong>
          📱 UPI
        </strong>

        <p>
          Pay using UPI
        </p>

      </label>


      <label class="payment-option">

        <input
          type="radio"
          name="paymentMethod"
          value="Cash on Delivery"
        >

        <strong>
          💵 Cash on Delivery
        </strong>

        <p>
          Pay when your order arrives
        </p>

      </label>

    </div>


    <button
      id="placeOrderBtn"
      class="pay"
      onclick="placeOrder()"
    >
      Place Order
    </button>

  </div>


  <!-- SUCCESS -->

  <div
    class="box success"
    id="successBox"
  >

    <h2>
      Order Placed Successfully! ✅
    </h2>

    <p>
      Your order has been sent to GENZ FOOD SHOP.
    </p>


    <div
      class="order-id"
      id="orderId"
    ></div>


    <div
      class="order-text"
      id="orderText"
    ></div>


    <br>


    <a
      class="back"
      href="index.html"
    >
      ← Back to Menu
    </a>

  </div>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

  authDomain:
    "genz-food-shop.firebaseapp.com",

  projectId:
    "genz-food-shop",

  storageBucket:
    "genz-food-shop.firebasestorage.app",

  messagingSenderId:
    "259228392374",

  appId:
    "1:259228392374:web:6af3a0d3c93597a5b5bf17",

  measurementId:
    "G-LT095LEWJ6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* OWNER */

const OWNER_EMAIL =
  "snsuhail19@gmail.com";


/* CART */

let cart =
  JSON.parse(
    localStorage.getItem("genzCart")
  ) || [];


let currentUser =
  null;

let savedLocation =
  null;


/* ELEMENTS */

const loading =
  document.getElementById("loading");

const orderBox =
  document.getElementById("orderBox");

const customerBox =
  document.getElementById("customerBox");

const successBox =
  document.getElementById("successBox");

const message =
  document.getElementById("message");

const locationBox =
  document.getElementById("locationBox");


/* MESSAGE */

function showMessage(text) {

  message.textContent =
    text;

  message.style.display =
    "block";

}


function hideMessage() {

  message.style.display =
    "none";

}


/* LOAD PROFILE */

async function loadProfile(user) {

  try {

    const profileRef =
      doc(
        db,
        "users",
        user.uid
      );


    const snapshot =
      await getDoc(
        profileRef
      );


    if (!snapshot.exists()) {

      document.getElementById("name").value =
        user.displayName || "";

      locationBox.textContent =
        "⚠️ No saved GPS location. Please open Profile and add your location.";

      savedLocation = null;

      return;

    }


    const profile =
      snapshot.data();


    document.getElementById("name").value =
      profile.name ||
      user.displayName ||
      "";


    document.getElementById("phone").value =
      (profile.mobile || "")
        .replace("+91", "");


    document.getElementById("address").value =
      profile.address ||
      "";


    /*
      LOAD SAVED GPS LOCATION
    */

    if (
      profile.location &&
      typeof profile.location.latitude === "number" &&
      typeof profile.location.longitude === "number"
    ) {

      savedLocation = {

        latitude:
          profile.location.latitude,

        longitude:
          profile.location.longitude,

        accuracy:
          profile.location.accuracy || null

      };


      locationBox.textContent =
        "✅ Your saved delivery location is attached to this order. GPS accuracy: approximately " +
        (
          savedLocation.accuracy || "unknown"
        ) +
        " metres.";

    }

    else {

      savedLocation = null;

      locationBox.textContent =
        "⚠️ GPS location not saved. Please go to Profile → Edit Profile → Get My Location.";

    }

  }

  catch (error) {

    console.error(
      "PROFILE ERROR:",
      error
    );


    document.getElementById("name").value =
      user.displayName || "";


    locationBox.textContent =
      "⚠️ Could not load your saved location.";

  }

}


/* CART */

function saveCart() {

  localStorage.setItem(
    "genzCart",
    JSON.stringify(cart)
  );

  render();

}


window.changeQuantity =
function(id, amount) {

  const item =
    cart.find(
      i => i.id === id
    );


  if (!item) return;


  item.quantity += amount;


  if (item.quantity <= 0) {

    cart =
      cart.filter(
        i => i.id !== id
      );

  }


  saveCart();

};


/* RENDER */

function render() {

  const box =
    document.getElementById("items");


  if (cart.length === 0) {

    box.innerHTML = `
      <div class="empty">
        Your cart is empty.
        <br><br>
        <a class="back" href="index.html">
          Go to Menu
        </a>
      </div>
    `;


    document.getElementById("subtotal")
      .textContent = "0";

    document.getElementById("delivery")
      .textContent = "0";

    document.getElementById("total")
      .textContent = "0";

    return;

  }


  box.innerHTML =
    cart.map(item => `

      <div class="item">

        <img
          src="${item.image}"
          alt="${item.name}"
        >

        <div class="info">

          <h3>
            ${item.name}
          </h3>

          <p>
            ₹${item.price} each
          </p>

        </div>


        <div class="qty">

          <button
            onclick="changeQuantity(${item.id}, -1)"
          >
            −
          </button>

          <strong>
            ${item.quantity}
          </strong>

          <button
            onclick="changeQuantity(${item.id}, 1)"
          >
            +
          </button>

        </div>


        <strong>
          ₹${item.price * item.quantity}
        </strong>

      </div>

    `).join("");


  const subtotal =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.quantity,
      0
    );


  document.getElementById("subtotal")
    .textContent = subtotal;

  document.getElementById("delivery")
    .textContent = "0";

  document.getElementById("total")
    .textContent = subtotal;

}


/* PLACE ORDER */

window.placeOrder =
async function() {

  hideMessage();


  if (!currentUser) {

    showMessage(
      "Please login first."
    );

    return;

  }


  if (cart.length === 0) {

    showMessage(
      "Your cart is empty."
    );

    return;

  }


  const name =
    document.getElementById("name")
      .value.trim();


  let phone =
    document.getElementById("phone")
      .value.trim();


  const address =
    document.getElementById("address")
      .value.trim();


  const paymentElement =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    );


  if (
    !name ||
    !phone ||
    !address
  ) {

    showMessage(
      "Please fill in all customer details."
    );

    return;

  }


  if (!paymentElement) {

    showMessage(
      "Please select UPI or Cash on Delivery."
    );

    return;

  }


  /*
    GPS LOCATION REQUIRED
  */

  if (!savedLocation) {

    showMessage(
      "📍 Your delivery location is not saved. Please open Profile and add your location before placing an order."
    );

    return;

  }


  phone =
    phone.replace(
      /\D/g,
      ""
    );


  if (!/^[6-9]\d{9}$/.test(phone)) {

    showMessage(
      "Please enter a valid 10-digit Indian mobile number."
    );

    return;

  }


  const paymentMethod =
    paymentElement.value;


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.quantity,
      0
    );


  const orderItems =
    cart.map(item => ({

      id:
        item.id,

      name:
        item.name,

      price:
        item.price,

      quantity:
        item.quantity,

      image:
        item.image,

      itemTotal:
        item.price *
        item.quantity

    }));


  const button =
    document.getElementById(
      "placeOrderBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "Placing Order...";


  try {

    const isOwner =
      currentUser.email &&
      currentUser.email.toLowerCase() ===
      OWNER_EMAIL.toLowerCase();


    /*
      ORDER DATA
    */

    const orderData = {

      userId:
        currentUser.uid,

      customerType:
        isOwner
          ? "Owner"
          : "Customer",

      customerName:
        name,

      customerEmail:
        currentUser.email || "",

      phone:
        "+91" + phone,

      address:
        address,


      /*
        VERIFIED DELIVERY LOCATION
      */

      location: {

        latitude:
          savedLocation.latitude,

        longitude:
          savedLocation.longitude,

        accuracy:
          savedLocation.accuracy

      },


      items:
        orderItems,

      subtotal:
        total,

      delivery:
        0,

      total:
        total,

      paymentMethod:
        paymentMethod,

      paymentStatus:
        "Pending",

      status:
        "Pending",

      createdAt:
        serverTimestamp()

    };


    const orderRef =
      await addDoc(
        collection(
          db,
          "orders"
        ),
        orderData
      );


    /* CLEAR CART */

    cart = [];

    localStorage.removeItem(
      "genzCart"
    );


    /* SUCCESS */

    document.getElementById(
      "orderId"
    ).textContent =
      "Order ID: " +
      orderRef.id;


    const lines =
      orderItems.map(
        item =>
          `${item.name} × ${item.quantity} = ₹${item.itemTotal}`
      ).join("\n");


    document.getElementById(
      "orderText"
    ).textContent =

`Order Type: ${isOwner ? "Owner Order" : "Customer Order"}

Customer: ${name}

Email: ${currentUser.email || "-"}

Phone: +91${phone}

Address: ${address}

GPS Location:
Latitude: ${savedLocation.latitude}
Longitude: ${savedLocation.longitude}
Accuracy: approximately ${savedLocation.accuracy || "unknown"} metres


${lines}


Total: ₹${total}

Payment: ${paymentMethod}

Payment Status: Pending

Order Status: Pending`;


    customerBox.style.display =
      "none";

    orderBox.style.display =
      "none";

    successBox.style.display =
      "block";

  }

  catch (error) {

    console.error(
      "PLACE ORDER ERROR:",
      error
    );


    showMessage(
      "Could not place order: " +
      (
        error.code ||
        error.message
      )
    );


    button.disabled =
      false;

    button.textContent =
      "Place Order";

  }

};


/* LOGIN */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      window.location.replace(
        "login.html"
      );

      return;

    }


    currentUser =
      user;


    loading.style.display =
      "none";


    orderBox.style.display =
      "block";


    if (cart.length > 0) {

      customerBox.style.display =
        "block";

      await loadProfile(user);

    }


    render();

  }
);

</script>

</body>
</html>
