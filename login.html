<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - GENZ FOOD SHOP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;

      background: #ff5a1f;
      color: white;

      border-radius: 18px;

      font-size: 32px;
      font-weight: 900;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      font-size: 14px;
    }

    .step {
      color: #ff5a1f;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff5a1f;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .google-btn {
      background: #171717;
      color: white;
    }

    .continue-btn {
      background: #ff5a1f;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .user-info {
      background: #fff8f3;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .user-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .user-info span {
      color: #777;
      font-size: 14px;
      word-break: break-word;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3ec;
      color: #8b3c17;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .success {
      text-align: center;
      color: #16803c;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">G</div>

    <h1>GENZ FOOD SHOP</h1>

    <p class="subtitle">
      Login to continue to our food shop
    </p>


    <!-- =====================================
         STEP 1 - GOOGLE LOGIN
    ====================================== -->

    <div id="step1">

      <div class="step">
        STEP 1
      </div>

      <h2>Login with Google</h2>

      <p style="color:#777;font-size:14px;">
        Continue with your Gmail account to create your profile.
      </p>

      <button
        id="googleBtn"
        class="google-btn"
      >
        Continue with Google
      </button>

    </div>


    <!-- =====================================
         STEP 2 - USER DETAILS
    ====================================== -->

    <div
      id="step2"
      class="hidden"
    >

      <div class="step">
        STEP 2
      </div>

      <h2>Your Information</h2>

      <div class="user-info">

        <strong id="googleName">
          -
        </strong>

        <span id="googleEmail">
          -
        </span>

      </div>


      <label for="mobile">
        Mobile Number
      </label>

      <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="9876543210"
      >


      <label for="address">
        Address
      </label>

      <textarea
        id="address"
        placeholder="House number, street, area..."
      ></textarea>


      <label for="city">
        City
      </label>

      <input
        id="city"
        type="text"
        placeholder="Your city"
      >


      <label for="pincode">
        PIN Code
      </label>

      <input
        id="pincode"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="600001"
      >


      <button
        id="continueBtn"
        class="continue-btn"
      >
        Continue to Shop →
      </button>


      <button
        id="logoutBtn"
        class="logout-btn"
      >
        Logout
      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message hidden"
    ></div>

    <div
      id="success"
      class="success hidden"
    >
      Login successful. Opening shop...
    </div>

  </div>


  <!-- =====================================
       FIREBASE
  ====================================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================
       FIREBASE CONFIG
    ====================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

      authDomain:
        "genz-food-shop.firebaseapp.com",

      projectId:
        "genz-food-shop",

      storageBucket:
        "genz-food-shop.firebasestorage.app",

      messagingSenderId:
        "259228392374",

      appId:
        "1:259228392374:web:6af3a0d3c93597a5b5bf17",

      measurementId:
        "G-LT095LEWJ6"

    };


    /* =====================================
       INITIALIZE
    ====================================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const provider =
      new GoogleAuthProvider();


    /* =====================================
       ELEMENTS
    ====================================== */

    const step1 =
      document.getElementById("step1");

    const step2 =
      document.getElementById("step2");

    const googleBtn =
      document.getElementById("googleBtn");

    const continueBtn =
      document.getElementById("continueBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const message =
      document.getElementById("message");

    const success =
      document.getElementById("success");


    let currentUser = null;


    /* =====================================
       MESSAGE
    ====================================== */

    function showMessage(text) {

      message.textContent =
        text;

      message.classList.remove(
        "hidden"
      );

    }


    function hideMessage() {

      message.classList.add(
        "hidden"
      );

    }


    /* =====================================
       LOAD EXISTING PROFILE
    ====================================== */

    async function loadExistingProfile(user) {

      try {

        const profileRef =
          doc(
            db,
            "users",
            user.uid
          );

        const snapshot =
          await getDoc(
            profileRef
          );


        if (snapshot.exists()) {

          const profile =
            snapshot.data();


          document.getElementById(
            "mobile"
          ).value =
            (profile.mobile || "")
              .replace("+91", "");


          document.getElementById(
            "address"
          ).value =
            profile.address || "";


          document.getElementById(
            "city"
          ).value =
            profile.city || "";


          document.getElementById(
            "pincode"
          ).value =
            profile.pincode || "";

        }

      }

      catch (error) {

        console.error(
          "PROFILE LOAD ERROR:",
          error
        );

      }

    }


    /* =====================================
       GOOGLE LOGIN
    ====================================== */

    googleBtn.addEventListener(
      "click",
      async () => {

        hideMessage();

        googleBtn.disabled = true;

        googleBtn.textContent =
          "Opening Google...";


        try {

          const result =
            await signInWithPopup(
              auth,
              provider
            );


          currentUser =
            result.user;


          document.getElementById(
            "googleName"
          ).textContent =
            currentUser.displayName ||
            "Google User";


          document.getElementById(
            "googleEmail"
          ).textContent =
            currentUser.email ||
            "";


          await loadExistingProfile(
            currentUser
          );


          step1.classList.add(
            "hidden"
          );

          step2.classList.remove(
            "hidden"
          );


        }

        catch (error) {

          console.error(
            "GOOGLE LOGIN ERROR:",
            error
          );


          showMessage(
            "Google login failed: " +
            (
              error.code ||
              error.message
            )
          );


          googleBtn.disabled =
            false;

          googleBtn.textContent =
            "Continue with Google";

        }

      }
    );


    /* =====================================
       SAVE USER INFORMATION
    ====================================== */

    continueBtn.addEventListener(
      "click",
      async () => {

        hideMessage();


        if (!currentUser) {

          showMessage(
            "Please login with Google first."
          );

          return;

        }


        const mobile =
          document
            .getElementById("mobile")
            .value
            .trim()
            .replace(/\D/g, "");


        const address =
          document
            .getElementById("address")
            .value
            .trim();


        const city =
          document
            .getElementById("city")
            .value
            .trim();


        const pincode =
          document
            .getElementById("pincode")
            .value
            .trim();


        /* VALIDATION */

        if (
          !/^[6-9]\d{9}$/.test(
            mobile
          )
        ) {

          showMessage(
            "Please enter a valid 10-digit Indian mobile number."
          );

          return;

        }


        if (!address) {

          showMessage(
            "Please enter your address."
          );

          return;

        }


        if (!city) {

          showMessage(
            "Please enter your city."
          );

          return;

        }


        if (
          !/^\d{6}$/.test(
            pincode
          )
        ) {

          showMessage(
            "Please enter a valid 6-digit PIN code."
          );

          return;

        }


        continueBtn.disabled =
          true;

        continueBtn.textContent =
          "Saving...";


        try {

          const profile = {

            name:
              currentUser.displayName || "",

            email:
              currentUser.email || "",

            mobile:
              "+91" + mobile,

            address:
              address,

            city:
              city,

            pincode:
              pincode,

            photoURL:
              currentUser.photoURL || "",

            updatedAt:
              new Date().toISOString()

          };


          await setDoc(

            doc(
              db,
              "users",
              currentUser.uid
            ),

            profile,

            {
              merge: true
            }

          );


          success.classList.remove(
            "hidden"
          );


          continueBtn.textContent =
            "Opening Shop...";


          /*
             USER IS NOW LOGGED IN.
             OPEN THE SHOP.
          */

          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            700
          );

        }

        catch (error) {

          console.error(
            "SAVE ERROR:",
            error
          );


          showMessage(
            "Could not save your information: " +
            (
              error.code ||
              error.message
            )
          );


          continueBtn.disabled =
            false;

          continueBtn.textContent =
            "Continue to Shop →";

        }

      }
    );


    /* =====================================
       LOGOUT
    ====================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);


          currentUser =
            null;


          step2.classList.add(
            "hidden"
          );

          step1.classList.remove(
            "hidden"
          );


          document.getElementById(
            "mobile"
          ).value = "";

          document.getElementById(
            "address"
          ).value = "";

          document.getElementById(
            "city"
          ).value = "";

          document.getElementById(
            "pincode"
          ).value = "";


          googleBtn.disabled =
            false;

          googleBtn.textContent =
            "Continue with Google";


          hideMessage();

        }

        catch (error) {

          showMessage(
            "Logout failed: " +
            (
              error.code ||
              error.message
            )
          );

        }

      }
    );


    /* =====================================
       CHECK CURRENT LOGIN
    ====================================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        /*
          IMPORTANT:

          If user is already logged in,
          DO NOT redirect to login.html.

          Instead show their information
          and allow them to continue.
        */

        if (user) {

          currentUser =
            user;


          document.getElementById(
            "googleName"
          ).textContent =
            user.displayName ||
            "Google User";


          document.getElementById(
            "googleEmail"
          ).textContent =
            user.email ||
            "";


          await loadExistingProfile(
            user
          );


          step1.classList.add(
            "hidden"
          );

          step2.classList.remove(
            "hidden"
          );

        }

        else {

          /*
            No user = stay on the
            Google login screen.

            DO NOT redirect to login.html.
          */

          step1.classList.remove(
            "hidden"
          );

          step2.classList.add(
            "hidden"
          );

        }

      }
    );

  </script>

</body>

</html>
