<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GENZ FOOD SHOP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f3;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      width: 55px;
      height: 55px;
      background: #ff5a1f;
      color: white;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .step-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .step-text {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 13px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff5a1f;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 11px;
      background: #ff5a1f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .google-btn {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .dark-btn {
      background: #171717;
    }

    .hidden {
      display: none;
    }

    .account-info {
      background: #fff3ec;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .profile {
      background: #fff8f3;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.8;
      font-size: 14px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      background: #fff3ec;
      color: #8b3c17;
      border-radius: 10px;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #ff5a1f;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">G</div>

  <h1>GENZ FOOD SHOP</h1>

  <p class="subtitle">
    Create your customer account
  </p>


  <!-- STEP 1: GOOGLE LOGIN -->

  <div id="googleStep">

    <div class="step-title">
      Step 1 — Continue with Gmail
    </div>

    <div class="step-text">
      Sign in with
