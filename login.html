<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - GENZ FOOD SHOP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: #ff5a1f;
      color: white;
      border-radius: 18px;
      font-size: 32px;
      font-weight: 900;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      font-size: 14px;
    }

    .step {
      color: #ff5a1f;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff5a1f;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .google-btn {
      background: #171717;
      color: white;
    }

    .continue-btn {
      background: #ff5a1f;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #222;
    }

    .location-btn {
      background: #16803a;
      color: white;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .user-info {
      background: #fff8f3;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .user-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .user-info span {
      color: #777;
      font-size: 14px;
      word-break: break-word;
    }

    .location-info {
      background: #eef9f1;
      color: #176b31;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3ec;
      color: #8b3c17;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .success {
      text-align: center;
      color: #16803c;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">G</div>

    <h1>GENZ FOOD SHOP</h1>

    <p class="subtitle">
      Login to continue to our food shop
    </p>


    <!-- STEP 1 -->

    <div id="step1">

      <div class="step">
        STEP 1
      </div>

      <h2>Login with Google</h2>

      <p style="color:#777;font-size:14px;">
        Continue with your Gmail account to create your profile.
      </p>

      <button
        id="googleBtn"
        class="google-btn"
      >
        Continue with Google
      </button>

    </div>


    <!-- STEP 2 -->

    <div id="step2" class="hidden">

      <div class="step">
        STEP 2
      </div>

      <h2>Your Information</h2>

      <div class="user-info">

        <strong id="googleName">-</strong>

        <span id="googleEmail">-</span>

      </div>


      <label for="mobile">
        Mobile Number
      </label>

      <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="9876543210"
      >


      <!-- LOCATION -->

      <label>
        Delivery Location
      </label>

      <button
        type="button"
        id="locationBtn"
        class="location-btn"
      >
        📍 Get My Location
      </button>

      <div
        id="locationInfo"
        class="location-info hidden"
      ></div>


      <!-- ADDRESS -->

      <label for="address">
        Address
      </label>

      <textarea
        id="address"
        placeholder="Your location address will appear here"
      ></textarea>


      <label for="city">
        City
      </label>

      <input
        id="city"
        type="text"
        placeholder="Your city"
      >


      <label for="pincode">
        PIN Code
      </label>

      <input
        id="pincode"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="600001"
      >


      <button
        id="continueBtn"
        class="continue-btn"
      >
        Continue to Shop →
      </button>


      <button
        id="logoutBtn"
        class="logout-btn"
      >
        Logout
      </button>

    </div>


    <div id="message" class="message hidden"></div>

    <div id="success" class="success hidden">
      Login successful. Opening shop...
    </div>

  </div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyBYgXkb6ED1gQDbpJpNj3a8fvwDqmOv5yQ",

  authDomain:
    "genz-food-shop.firebaseapp.com",

  projectId:
    "genz-food-shop",

  storageBucket:
    "genz-food-shop.firebasestorage.app",

  messagingSenderId:
    "259228392374",

  appId:
    "1:259228392374:web:6af3a0d3c93597a5b5bf17",

  measurementId:
    "G-LT095LEWJ6"

};


/* INITIALIZE */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const provider =
  new GoogleAuthProvider();


/* ELEMENTS */

const step1 =
  document.getElementById("step1");

const step2 =
  document.getElementById("step2");

const googleBtn =
  document.getElementById("googleBtn");

const continueBtn =
  document.getElementById("continueBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const locationBtn =
  document.getElementById("locationBtn");

const locationInfo =
  document.getElementById("locationInfo");

const message =
  document.getElementById("message");

const success =
  document.getElementById("success");


let currentUser = null;

let currentLatitude = null;
let currentLongitude = null;


/* MESSAGE */

function showMessage(text) {

  message.textContent =
    text;

  message.classList.remove(
    "hidden"
  );

}


function hideMessage() {

  message.classList.add(
    "hidden"
  );

}


/* =====================================
   GET LOCATION
===================================== */

locationBtn.addEventListener(
  "click",
  () => {

    hideMessage();

    if (!navigator.geolocation) {

      showMessage(
        "Location is not supported by this browser."
      );

      return;

    }


    locationBtn.disabled = true;

    locationBtn.textContent =
      "📍 Getting your location...";


    navigator.geolocation.getCurrentPosition(

      async (position) => {

        currentLatitude =
          position.coords.latitude;

        currentLongitude =
          position.coords.longitude;


        locationInfo.textContent =
          "✅ Location detected successfully.";

        locationInfo.classList.remove(
          "hidden"
        );


        try {

          /*
            Reverse geocoding.
            Converts GPS coordinates
            into readable address.
          */

          const url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2" +
            "&lat=" +
            encodeURIComponent(currentLatitude) +
            "&lon=" +
            encodeURIComponent(currentLongitude) +
            "&addressdetails=1";


          const response =
            await fetch(url, {
              headers: {
                "Accept": "application/json"
              }
            });


          if (!response.ok) {
            throw new Error(
              "Unable to find address."
            );
          }


          const data =
            await response.json();


          const addressData =
            data.address || {};


          const displayAddress =
            data.display_name || "";


          document.getElementById(
            "address"
          ).value =
            displayAddress;


          const city =
            addressData.city ||
            addressData.town ||
            addressData.village ||
            addressData.municipality ||
            "";


          document.getElementById(
            "city"
          ).value =
            city;


          const pincode =
            addressData.postcode || "";


          document.getElementById(
            "pincode"
          ).value =
            pincode;


          locationInfo.textContent =
            "✅ Location detected and address filled automatically.";


        }

        catch (error) {

          console.error(
            "REVERSE LOCATION ERROR:",
            error
          );


          locationInfo.textContent =
            "✅ GPS location detected. Please enter address details manually.";

        }


        locationBtn.disabled =
          false;

        locationBtn.textContent =
          "📍 Update My Location";

      },


      (error) => {

        console.error(
          "LOCATION ERROR:",
          error
        );


        let text =
          "Unable to get your location.";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          text =
            "Location permission was denied. Please allow location permission in browser settings.";

        }


        if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          text =
            "Your location is currently unavailable. Please try again.";

        }


        if (
          error.code ===
          error.TIMEOUT
        ) {

          text =
            "Location request timed out. Please try again.";

        }


        showMessage(text);


        locationBtn.disabled =
          false;

        locationBtn.textContent =
          "📍 Get My Location";

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  }
);


/* =====================================
   LOAD EXISTING PROFILE
===================================== */

async function loadExistingProfile(user) {

  try {

    const profileRef =
      doc(
        db,
        "users",
        user.uid
      );


    const snapshot =
      await getDoc(
        profileRef
      );


    if (snapshot.exists()) {

      const profile =
        snapshot.data();


      document.getElementById(
        "mobile"
      ).value =
        (profile.mobile || "")
          .replace("+91", "");


      document.getElementById(
        "address"
      ).value =
        profile.address || "";


      document.getElementById(
        "city"
      ).value =
        profile.city || "";


      document.getElementById(
        "pincode"
      ).value =
        profile.pincode || "";


      if (
        profile.latitude &&
        profile.longitude
      ) {

        currentLatitude =
          profile.latitude;

        currentLongitude =
          profile.longitude;


        locationInfo.textContent =
          "✅ Saved delivery location is available.";

        locationInfo.classList.remove(
          "hidden"
        );

        locationBtn.textContent =
          "📍 Update My Location";

      }

    }

  }

  catch (error) {

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

  }

}


/* =====================================
   GOOGLE LOGIN
===================================== */

googleBtn.addEventListener(
  "click",
  async () => {

    hideMessage();

    googleBtn.disabled =
      true;

    googleBtn.textContent =
      "Opening Google...";


    try {

      const result =
        await signInWithPopup(
          auth,
          provider
        );


      currentUser =
        result.user;


      document.getElementById(
        "googleName"
      ).textContent =
        currentUser.displayName ||
        "Google User";


      document.getElementById(
        "googleEmail"
      ).textContent =
        currentUser.email ||
        "";


      await loadExistingProfile(
        currentUser
      );


      step1.classList.add(
        "hidden"
      );

      step2.classList.remove(
        "hidden"
      );


    }

    catch (error) {

      console.error(
        "GOOGLE LOGIN ERROR:",
        error
      );


      showMessage(
        "Google login failed: " +
        (
          error.code ||
          error.message
        )
      );


      googleBtn.disabled =
        false;

      googleBtn.textContent =
        "Continue with Google";

    }

  }
);


/* =====================================
   SAVE USER INFORMATION
===================================== */

continueBtn.addEventListener(
  "click",
  async () => {

    hideMessage();


    if (!currentUser) {

      showMessage(
        "Please login with Google first."
      );

      return;

    }


    const mobile =
      document
        .getElementById("mobile")
        .value
        .trim()
        .replace(/\D/g, "");


    const address =
      document
        .getElementById("address")
        .value
        .trim();


    const city =
      document
        .getElementById("city")
        .value
        .trim();


    const pincode =
      document
        .getElementById("pincode")
        .value
        .trim();


    if (
      !/^[6-9]\d{9}$/.test(
        mobile
      )
    ) {

      showMessage(
        "Please enter a valid 10-digit Indian mobile number."
      );

      return;

    }


    /*
      Require GPS location.
    */

    if (
      currentLatitude === null ||
      currentLongitude === null
    ) {

      showMessage(
        "Please click 📍 Get My Location and allow location permission before continuing."
      );

      return;

    }


    if (!address) {

      showMessage(
        "Location address could not be detected. Please try getting your location again."
      );

      return;

    }


    if (!city) {

      showMessage(
        "City could not be detected. Please get your location again."
      );

      return;

    }


    if (
      !/^\d{6}$/.test(
        pincode
      )
    ) {

      showMessage(
        "Please enter a valid 6-digit PIN code."
      );

      return;

    }


    continueBtn.disabled =
      true;

    continueBtn.textContent =
      "Saving...";


    try {

      const profile = {

        name:
          currentUser.displayName || "",

        email:
          currentUser.email || "",

        mobile:
          "+91" + mobile,

        address:
          address,

        city:
          city,

        pincode:
          pincode,

        latitude:
          currentLatitude,

        longitude:
          currentLongitude,

        locationAccuracy:
          null,

        locationUpdatedAt:
          new Date().toISOString(),

        photoURL:
          currentUser.photoURL || "",

        updatedAt:
          new Date().toISOString()

      };


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        profile,

        {
          merge: true
        }

      );


      success.classList.remove(
        "hidden"
      );


      continueBtn.textContent =
        "Opening Shop...";


      setTimeout(
        () => {

          window.location.href =
            "index.html";

        },
        700
      );

    }

    catch (error) {

      console.error(
        "SAVE ERROR:",
        error
      );


      showMessage(
        "Could not save your information: " +
        (
          error.code ||
          error.message
        )
      );


      continueBtn.disabled =
        false;

      continueBtn.textContent =
        "Continue to Shop →";

    }

  }
);


/* =====================================
   LOGOUT
===================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    try {

      await signOut(auth);

      currentUser =
        null;

      step2.classList.add(
        "hidden"
      );

      step1.classList.remove(
        "hidden"
      );

      hideMessage();

      googleBtn.disabled =
        false;

      googleBtn.textContent =
        "Continue with Google";

    }

    catch (error) {

      showMessage(
        "Logout failed: " +
        (
          error.code ||
          error.message
        )
      );

    }

  }
);


/* =====================================
   CHECK CURRENT LOGIN
===================================== */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser =
        user;


      document.getElementById(
        "googleName"
      ).textContent =
        user.displayName ||
        "Google User";


      document.getElementById(
        "googleEmail"
      ).textContent =
        user.email ||
        "";


      await loadExistingProfile(
        user
      );


      step1.classList.add(
        "hidden"
      );

      step2.classList.remove(
        "hidden"
      );

    }

    else {

      step1.classList.remove(
        "hidden"
      );

      step2.classList.add(
        "hidden"
      );

    }

  }
);

</script>

</body>
</html>
