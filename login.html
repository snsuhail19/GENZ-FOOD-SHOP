<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GENZ FOOD SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff7f1,#fff);display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border:1px solid #eee;border-radius:24px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.09)}
.logo{width:58px;height:58px;border-radius:17px;background:#ff5a1f;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:14px}
h1{margin:0;font-size:26px}
.sub{color:#777;margin:7px 0 25px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;outline:none}
input:focus{border-color:#ff5a1f}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#ff5a1f;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:14px}
button:disabled{opacity:.6}
.hidden{display:none}
.msg{margin-top:14px;padding:11px;border-radius:10px;background:#fff3ec;color:#8b3c17;font-size:13px}
.back{display:block;text-align:center;margin-top:18px;color:#ff5a1f;text-decoration:none;font-weight:700}
#recaptcha-container{margin-top:14px}
.small{font-size:12px;color:#888;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">G</div>
  <h1>Welcome to GENZ FOOD SHOP</h1>
  <p class="sub">Login with your mobile number</p>

  <section id="phoneStep">
    <label for="phone">Mobile number</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="+91 9876543210" autocomplete="tel">
    <div id="recaptcha-container"></div>
    <button id="sendBtn" onclick="sendOTP()">Send OTP</button>
  </section>

  <section id="otpStep" class="hidden">
    <label for="otp">Enter OTP</label>
    <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
    <button id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
    <button type="button" onclick="location.reload()" style="background:#222">Change number</button>
  </section>

  <div id="message" class="msg hidden"></div>
  <p class="small">By continuing, the phone number is used for account authentication. SMS charges may apply depending on the user's carrier.</p>
  <a class="back" href="index.html">← Back to Shop</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

/*
  STEP 1: Replace the values below with your Firebase Web App config.
  Firebase Console → Project settings → Your apps → Web app → SDK setup.
*/
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.useDeviceLanguage();

let confirmationResult = null;
let recaptchaVerifier = null;

const message = (text) => {
  const el = document.getElementById("message");
  el.textContent = text;
  el.classList.remove("hidden");
};

function setupRecaptcha() {
  if (recaptchaVerifier) return;
  recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal",
    callback: () => {}
  });
}

window.sendOTP = async function() {
  const raw = document.getElementById("phone").value.trim();
  if (!raw) return message("Enter your mobile number.");
  const phone = raw.startsWith("+") ? raw : "+91" + raw.replace(/\D/g, "");

  if (!/^\+\d{8,15}$/.test(phone)) {
    return message("Enter a valid phone number, for example +91 9876543210.");
  }

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  message("Preparing verification...");

  try {
    setupRecaptcha();
    confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
    document.getElementById("phoneStep").classList.add("hidden");
    document.getElementById("otpStep").classList.remove("hidden");
    message("OTP sent. Check your SMS.");
  } catch (error) {
    console.error(error);
    message("Could not send OTP: " + (error.code || error.message));
    btn.disabled = false;
    try { await recaptchaVerifier.render(); } catch(e) {}
  }
};

window.verifyOTP = async function() {
  const code = document.getElementById("otp").value.trim();
  if (!confirmationResult) return message("Please request an OTP first.");
  if (!/^\d{6}$/.test(code)) return message("Enter the 6-digit OTP.");

  const btn = document.getElementById("verifyBtn");
  btn.disabled = true;

  try {
    const result = await confirmationResult.confirm(code);
    const user = result.user;
    localStorage.setItem("genzLoggedIn", "true");
    localStorage.setItem("genzPhone", user.phoneNumber || "");
    message("Login successful. Redirecting...");
    setTimeout(() => location.href = "index.html", 700);
  } catch (error) {
    console.error(error);
    message("Invalid or expired OTP. Please try again.");
    btn.disabled = false;
  }
};

onAuthStateChanged(auth, (user) => {
  if (user && location.pathname.endsWith("login.html")) {
    // User is already signed in; leave the page usable rather than forcing a redirect.
  }
});
</script>
</body>
</html>
